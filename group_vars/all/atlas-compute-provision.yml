###############################################################################
# atlas-compute-provision — standalone operator surface (./run.sh)
# -----------------------------------------------------------------------------
# Purpose : site identity, stack/maps, PVE/DNS secrets, template catalog
# Defaults: playbooks/group_vars/all/provision_defaults.yml
#           (+ roles/*/defaults for role-local knobs)
# Docs    : README.md
#           (orchestrated leaves: group_vars/all/atlas-compute-provision.yml)
#
# Secrets: see group_vars/all/atlas-compute-provision.secrets.yml (Vault-friendly).
# Standalone alternative: EXTRA_VARS_FILE=examples/secrets.example.yml
# Workspace env: CLUSTER_WORKSPACE_ID / PARENT / ROOT (00_ensure_workspace).
#
# Default stack: jenkins. Switch stack + maps via catalog maps / EXTRA_VARS_FILE.
###############################################################################

# =============================================================================
# Identity / workspace
# =============================================================================
dns_domain_suffix: example.com
cluster_domain: "ci.{{ dns_domain_suffix }}"
cluster_workspace_id: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ID') | default(cluster_domain, true) }}"
cluster_workspace_parent: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_PARENT') | default('./workspace', true) }}"
cluster_workspace_root: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ROOT') | default(cluster_workspace_parent ~ '/' ~ cluster_workspace_id, true) }}"
atlas_cluster_root: "{{ lookup('ansible.builtin.env', 'ATLAS_CLUSTER_ROOT', default='') | default('.', true) }}"
cluster_id: "{{ lookup('ansible.builtin.env', 'CLUSTER_ID', default='') | default(cluster_workspace_id, true) }}"

controller_workspace: "{{ cluster_workspace_root }}/controller-state"
controller_manifests_dir: "{{ controller_workspace }}/manifests"
controller_reports_dir: "{{ controller_workspace }}/reports"
controller_kubeconfig: "{{ controller_workspace }}/kubeconfig/admin.conf"
controller_python_venv: "{{ controller_workspace }}/venv"
controller_bin_dir: "{{ controller_workspace }}/bin"
controller_helm_config_dir: "{{ controller_workspace }}/helm-config"
controller_ca_cert_dir: "{{ controller_workspace }}/certs"
controller_staging_dir: "{{ controller_workspace }}/staging"
controller_secrets_dir: "{{ controller_workspace }}/secrets"
k8s_control_plane_scripts_dir: "{{ controller_workspace }}/scripts"

ansible_user: localuser

# =============================================================================
# Stack
# =============================================================================
# TF layout under stacks/<name>/. Default standalone stack: jenkins.
provision_stack: jenkins
# Lifecycle: apply | recreate | destroy
provision_mode: apply

# =============================================================================
# Inventory → Terraform maps
# =============================================================================
provision_hosts_file: "{{ playbook_dir }}/../inventory-example.yml"
provision_inventory_group_map_jenkins:
  jslave: jslave_vms
provision_tf_module_map_jenkins:
  jslave_vms: proxmox_jslaves

provision_inventory_group_map_gitlab_runner:
  gitlab_runners: gitlab_runner_vms
provision_tf_module_map_gitlab_runner:
  gitlab_runner_vms: proxmox_gitlab_runners

# Also shipped for EXTRA_VARS_FILE / stack switch smoke (infra leaf uses these).
provision_inventory_group_map_infra:
  infra_platform: infra_node
provision_tf_module_map_infra:
  infra_node: proxmox_infra_node

# Redis / Kafka / PostgreSQL / k8s maps (switch provision_stack + EXTRA_VARS or leaf overlay).
provision_inventory_group_map_redis:
  redis_cluster_masters: redis_cluster_master_node
  redis_cluster_replicas: redis_cluster_replica_node
  redis_proxies: redis_proxy_node
  redis_lbs: redis_lbs_node
provision_tf_module_map_redis:
  redis_cluster_master_node: proxmox_redis_cluster_master
  redis_cluster_replica_node: proxmox_redis_cluster_replica
  redis_proxy_node: proxmox_redis_proxy
  redis_lbs_node: proxmox_redis_lbs

provision_inventory_group_map_kafka:
  kafka_controllers: kafka_controller_node
  kafka_brokers: kafka_broker_node
provision_tf_module_map_kafka:
  kafka_controller_node: proxmox_kafka_controller
  kafka_broker_node: proxmox_kafka_broker

provision_inventory_group_map_postgresql:
  pgsql_etcd_cluster: pgsql_etcd_node
  pgsql_cluster: pgsql_cluster_node
  pgsql_lbs: pgsql_lbs_node
provision_tf_module_map_postgresql:
  pgsql_etcd_node: proxmox_pgsql_etcd
  pgsql_cluster_node: proxmox_pgsql_cluster
  pgsql_lbs_node: proxmox_pgsql_lbs

provision_inventory_group_map_k8s:
  k8s_lbs: lbs_node
  k8s_masters: masters_node
  k8s_workers: workers_node
provision_tf_module_map_k8s:
  lbs_node: proxmox_lbs_node
  masters_node: proxmox_masters_node
  workers_node: proxmox_workers_node

# =============================================================================
# Guest network (cloud-init)
# =============================================================================
# nameserver / searchdomain / prefix: product defaults (provision_defaults.yml)
provision_gateway: "192.168.1.1"

# =============================================================================
# Proxmox — SSH (image upload / qm) + API (Terraform)
# =============================================================================
provision_pve_host: "pve.{{ dns_domain_suffix }}"
provision_pve_user: root
# provision_pve_ssh_password → atlas-compute-provision.secrets.yml
provision_pve_inventory_name: pve
provision_pve_inventory_group: proxmox
provision_pve_upload_dir: /mnt/ramdisk             # lab often uses /tmp/

provision_proxmox_api_url: "https://{{ provision_pve_host }}:8006/api2/json"
provision_proxmox_target_node: pve                  # alt: proxmox2
provision_proxmox_parallel: 10                     # lab often raises this
provision_tf_parallelism: 3                       # terraform apply -parallelism
# provision_proxmox_token_id / provision_proxmox_token_secret → *.secrets.yml

# =============================================================================
# Cloud templates
# =============================================================================
# Map key  = PVE template name = hosts.provision.clone
# Build (./run.sh templates / factory leaf): each entry needs id + image_url.
# Provision/clone: catalog optional. Terraform uses clone name only; when this
#   map is set it is a soft allowlist of names (id not required on provision).
# image_file / name are derived at runtime from key + image_url basename (when set).
provision_pve_templates:
  ubuntu-noble:
    id: 9001
    image_url: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
  oracle-ol9:
    id: 9002
    image_url: https://yum.oracle.com/templates/OracleLinux/OL9/u7/x86_64/OL9U7_x86_64-kvm-b289.qcow2
  debian-trixie:
    id: 9003
    image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2

# virt-customize before qm template (packages applied only when enabled)
build_cloud_image_customize_enabled: false
build_cloud_image_packages:
  - qemu-guest-agent

# =============================================================================
# DNS — RFC2136 / TSIG
# =============================================================================
provision_dns_server: "{{ provision_gateway }}"
provision_dns_zone: "{{ dns_domain_suffix }}."
provision_dns_key_name: "{{ dns_domain_suffix }}."
provision_dns_key_algorithm: hmac-sha256
provision_dns_transport: tcp4
# provision_dns_key_secret → atlas-compute-provision.secrets.yml
# When true, Terraform manages apex A records (not BIND inventory_a_records).
provision_dns_tf_manage_a_records: false

# =============================================================================
# Guest VM defaults (clone / disk / cloud-init)
# =============================================================================
provision_vm_full_clone: false                     # false = linked clone (faster lab)
provision_vm_cloudinit_storage: local-lvm           # lab often uses ramdisk
provision_vm_disk_cache: none                      # lab often uses unsafe
provision_vm_disk_format: raw
provision_vm_network_bridge: vmbr0
provision_vm_ciuser: root
# provision_vm_cipassword → atlas-compute-provision.secrets.yml
provision_ssh_public_key_file: "{{ playbook_dir }}/../examples/ssh/localuser.pub"

# =============================================================================
# Terraform state (git) — local-only by default
# =============================================================================
# Durable path defaults (ADR 001) live in playbooks/group_vars/all/provision_defaults.yml:
#   local_dir  = {{ atlas_cluster_root }}/tfstate-repo
#   prefix     = tfstate
#   cluster_path = tfstate/{{ cluster_id }}
# Leaf sets remote URL + push only. See docs/tfstate.md
gitea_host: git.example.com
provision_tf_state_repo: "git@{{ gitea_host }}:org/vms_state.git"
provision_tf_state_branch: main
provision_tf_state_git_push: false
git_user_name: "Atlas Provision"
git_user_email: "provision@example.com"

# Other stacks: examples/{infra,postgresql,kafka,k8s}/ via EXTRA_VARS_FILE
