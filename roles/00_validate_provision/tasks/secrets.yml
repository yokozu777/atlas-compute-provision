---
# Reject empty / placeholder secrets when live enforcement is on.
# Standalone catalog keeps provision_enforce_live_secrets: false so map/inventory
# validate smokes work with CHANGEME placeholders. Set true before real apply.

- name: Assert live PVE / DNS / guest secrets are not placeholders
  ansible.builtin.assert:
    that:
      - provision_pve_ssh_password | default('') | trim | length > 0
      - provision_pve_ssh_password | trim | upper != 'CHANGEME'
      - provision_proxmox_token_id | default('') | trim | length > 0
      - provision_proxmox_token_id | trim | upper != 'CHANGEME'
      - provision_proxmox_token_secret | default('') | trim | length > 0
      - provision_proxmox_token_secret | trim | upper != 'CHANGEME'
      - provision_dns_key_secret | default('') | trim | length > 0
      - provision_dns_key_secret | trim | upper != 'CHANGEME'
      - provision_vm_cipassword | default('') | trim | length > 0
      - provision_vm_cipassword | trim | upper != 'CHANGEME'
    fail_msg: >-
      provision_enforce_live_secrets=true rejects CHANGEME / empty values for
      provision_pve_ssh_password, provision_proxmox_token_id/secret,
      provision_dns_key_secret, provision_vm_cipassword
      (fill group_vars/all/atlas-compute-provision.yml or EXTRA_VARS_FILE / vault)
  when: provision_enforce_live_secrets | default(false) | bool

- name: Skip live-secret enforcement (placeholders allowed)
  ansible.builtin.debug:
    msg: >-
      provision_enforce_live_secrets=false — CHANGEME placeholders allowed for
      contract validate; set true before a live Proxmox/DNS apply
  when: not (provision_enforce_live_secrets | default(false) | bool)
