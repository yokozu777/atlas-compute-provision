---
# Controller workspace contract (play 00_ensure_workspace on localhost).
# Override via group_vars/all/atlas-compute-provision.yml or env:
#   CLUSTER_WORKSPACE_ID / CLUSTER_WORKSPACE_PARENT / CLUSTER_WORKSPACE_ROOT
cluster_domain: ci.example.com
cluster_workspace_id: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ID') | default(cluster_domain, true) }}"
cluster_workspace_parent: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_PARENT') | default('./workspace', true) }}"
cluster_workspace_root: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ROOT') | default(cluster_workspace_parent ~ '/' ~ cluster_workspace_id, true) }}"

controller_workspace: "{{ cluster_workspace_root }}/controller-state"
controller_manifests_dir: "{{ controller_workspace }}/manifests"
controller_reports_dir: "{{ controller_workspace }}/reports"
controller_kubeconfig: "{{ controller_workspace }}/kubeconfig/admin.conf"
controller_python_venv: "{{ controller_workspace }}/venv"
controller_bin_dir: "{{ controller_workspace }}/bin"
controller_helm_config_dir: "{{ controller_workspace }}/helm-config"
controller_ca_cert_dir: "{{ controller_workspace }}/certs"
controller_staging_dir: "{{ controller_workspace }}/staging"
controller_secrets_dir: "{{ controller_workspace }}/secrets"
k8s_control_plane_scripts_dir: "{{ controller_workspace }}/scripts"

# Durable TF state (ADR 001 Phase 1 — variant A).
#   local_dir  → {{ atlas_cluster_root }}/tfstate-repo   (checkout/clone of state remote)
#   prefix     → tfstate
#   cluster_path → tfstate/{{ cluster_id }}
# Scratch apply workdir stays under cluster_workspace_root/tf_workspace (never durable SoT).
# See docs/adr/001-tfstate-repo-prefix.md
provision_tf_state_local_dir: "{{ atlas_cluster_root | default('.', true) }}/tfstate-repo"
provision_tf_state_repo_prefix: tfstate
provision_tf_state_cluster_path: "{{ provision_tf_state_repo_prefix }}/{{ cluster_id | default(cluster_workspace_id, true) }}"
provision_tf_state_repo_dir: "{{ provision_tf_state_local_dir }}/{{ provision_tf_state_cluster_path }}"
provision_tf_state_repo_file: "{{ provision_tf_state_repo_dir }}/terraform.tfstate"
provision_tf_workspace_dir: "{{ cluster_workspace_root }}/tf_workspace"
provision_tf_workspace_state_file: "{{ provision_tf_workspace_dir }}/terraform.tfstate"
# Opt-in: discard dirty files under repo_prefix only (see 07/11). Default false.
provision_tf_state_git_discard_local: false
provision_generated_variables_tf: "{{ cluster_workspace_root }}/generated/variables.tf"
build_workdir: "{{ cluster_workspace_root }}/build/workspace"
build_state_file: "{{ cluster_workspace_root }}/build/build_templates_state.json"
