---
# Only needed when terraform state is pulled/pushed via git.
# SSH host-key checking is the executor's job (clusterctl / run.sh set
# GIT_SSH_COMMAND with StrictHostKeyChecking=no). This role only sets git
# commit identity for tf state remotes — do not mkdir/chmod the RO-mounted
# private-key directory from the executor.
- name: Configure git identity for terraform state remotes
  when: provision_tf_state_git_push | default(false) | bool
  block:
    - name: Set git config user.name
      community.general.git_config:
        name: user.name
        value: "{{ git_user_name }}"
        scope: global

    - name: Set git config user.email
      community.general.git_config:
        name: user.email
        value: "{{ git_user_email }}"
        scope: global

- name: Skip git configuration when terraform state git push is disabled
  ansible.builtin.debug:
    msg: "provision_tf_state_git_push=false — skipping git user config"
  when: not (provision_tf_state_git_push | default(false) | bool)
