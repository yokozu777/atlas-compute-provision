# Rename-smoke inventory — inventory group is NOT the default `jslave`.
# Pair with maps.example.yml:
#   INVENTORY=examples/rename_smoke/hosts.example.yml \
#     EXTRA_VARS_FILE=examples/rename_smoke/maps.example.yml \
#     ./run.sh provision --tags 00_validate_provision
#
# Checklist when renaming groups:
# 1. hosts group name (here: my_build_agents)
# 2. provision_inventory_group_map_<stack> keys (same name)
# 3. optional provision_wait_hosts
# TF map *values* / module names stay stack-stable (jslave_vms → proxmox_jslaves).

all:
  children:
    my_build_agents:
      hosts:
        192.0.2.50:
          hostname: agent01.example.com
          provision:
            vmid: "5200"
            sockets: 1
            cores: 4
            memory: 8192
            numa: false
            clone: ubuntu-noble
            disks:
              - size: "100"
                slot: 0
                storage: local-lvm
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_user: localuser
