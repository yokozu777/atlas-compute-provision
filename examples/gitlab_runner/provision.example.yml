# Minimal stack overlay for provision_nodes — gitlab_runner
# Prefer group_vars/all/atlas-compute-provision.yml + ./run.sh; use this as EXTRA_VARS_FILE to switch stacks:
#   EXTRA_VARS_FILE=examples/gitlab_runner/provision.example.yml ./run.sh provision --tags 00_validate_provision
#
# Fill secrets locally (or examples/secrets.example.yml); do not commit live values.

provision_stack: gitlab_runner
provision_mode: apply

provision_tf_state_git_push: false

provision_inventory_group_map_gitlab_runner:
  gitlab_runners: gitlab_runner_vms

provision_tf_module_map_gitlab_runner:
  gitlab_runner_vms: proxmox_gitlab_runners
