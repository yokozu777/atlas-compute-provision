# Prefer editing group_vars/all/atlas-compute-provision.secrets.yml (Vault-friendly canonical overlay).
# Standalone EXTRA_VARS_FILE alternative:
#   cp examples/secrets.example.yml /path/to/secrets.yml   # keep outside git if plaintext
#   # fill values, optionally: ansible-vault encrypt /path/to/secrets.yml
#   EXTRA_VARS_FILE=/path/to/secrets.yml ./run.sh
#

# Example secrets overlay for ./run.sh
# Usage:
#   cp examples/secrets.example.yml /path/to/secrets.yml   # keep outside git
#   # fill values, optionally: ansible-vault encrypt /path/to/secrets.yml
#   EXTRA_VARS_FILE=/path/to/secrets.yml ./run.sh provision
#
# These keys override group_vars/all/atlas-compute-provision.yml. Do not commit real secrets.
#
# Before a live apply, also set:
#   provision_enforce_live_secrets: true
# so 00_validate_provision rejects leftover CHANGEME placeholders.

provision_enforce_live_secrets: true

provision_pve_ssh_password: "CHANGEME"
provision_proxmox_token_id: "root@pam!terraform"
provision_proxmox_token_secret: "CHANGEME"
provision_dns_key_secret: "CHANGEME"
provision_vm_cipassword: "CHANGEME"

# Only when provision_tf_state_git_push: true
